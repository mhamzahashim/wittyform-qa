<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shop launch banners</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #f6f5ff; color: #14132a;
         font: 16px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.02em; }
  .lede { color: #6b6a86; margin: 0 0 32px; }
  figure { margin: 0 0 34px; }
  figcaption { font-weight: 700; margin-bottom: 8px; }
  figcaption span { display: block; font-weight: 400; color: #6b6a86; font-size: 14.5px; }
  img { max-width: 100%; height: auto; display: block; border-radius: 12px;
        border: 1px solid #e6e5f5; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Banners for the shop post</h1>
  <p class="lede">All 1200 by 630, the size LinkedIn, X and Facebook want. The first two are the
     chosen pair, redone in the site's copper colours with the real logo. The four below them
     are the earlier purple drafts.</p>

  <figure><figcaption>1. Your form is now a shop
    <span>Chosen. Copper scheme, real logo.</span></figcaption>
    <img src="1-form-is-a-shop.png" alt="Headline with three product cards" /></figure>

  <figure><figcaption>2. The receipt
    <span>Leads on trust: the total is worked out on the server, not in the browser.</span></figcaption>
    <img src="2-server-priced-receipt.png" alt="An itemised receipt" /></figure>

  <figure><figcaption>3. Before and after
    <span>A plain form on the left, the same form selling on the right.</span></figcaption>
    <img src="3-before-after.png" alt="A form and a shop side by side" /></figure>

  <figure><figcaption>4. The checklist
    <span>Six things it does. Good for a post where the picture carries the detail.</span></figcaption>
    <img src="4-checklist.png" alt="Six feature lines with ticks" /></figure>

  <figure><figcaption>5. On a phone
    <span>Chosen. Copper scheme, real logo, and the products no longer squeezed.</span></figcaption>
    <img src="5-on-a-phone.png" alt="The shop on a phone" /></figure>

  <figure><figcaption>6. Big type
    <span>Loudest of the six, and the one that reads at thumbnail size.</span></figcaption>
    <img src="6-big-type.png" alt="Add products. Take payments." /></figure>
</div>
</body>
</html>
